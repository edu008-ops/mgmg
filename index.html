<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>업무 FAQ 검색</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    .app {
      width: min(960px, calc(100% - 32px));
      margin: 48px auto;
    }

    .header {
      margin-bottom: 24px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 32px;
      letter-spacing: -0.04em;
    }

    .header p {
      margin: 0;
      color: #6b7280;
      font-size: 15px;
    }

    .search-panel {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 30px rgba(15, 23, 42, 0.05);
    }

    .search-row {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    #searchInput {
      flex: 1;
      min-width: 0;
      height: 48px;
      padding: 0 16px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #searchInput:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .button {
      height: 48px;
      padding: 0 18px;
      border: 0;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .button-primary {
      background: #2563eb;
      color: #ffffff;
    }

    .button-secondary {
      background: #eef2ff;
      color: #3730a3;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-btn {
      border: 1px solid #d1d5db;
      background: #ffffff;
      color: #374151;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .filter-btn.active {
      background: #111827;
      border-color: #111827;
      color: #ffffff;
    }

    .result-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 24px 0 12px;
    }

    .result-count {
      font-size: 15px;
      color: #4b5563;
      font-weight: 700;
    }

    .results {
      display: grid;
      gap: 12px;
    }

    .faq-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 20px;
    }

    .category {
      display: inline-block;
      margin-bottom: 10px;
      padding: 5px 9px;
      border-radius: 999px;
      background: #f3f4f6;
      color: #4b5563;
      font-size: 12px;
      font-weight: 800;
    }

    .question {
      margin: 0 0 10px;
      font-size: 18px;
      line-height: 1.5;
      letter-spacing: -0.02em;
    }

    .answer {
      margin: 0;
      color: #4b5563;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    mark {
      background: #fef08a;
      color: inherit;
      padding: 0 2px;
      border-radius: 3px;
    }

    .empty {
      background: #ffffff;
      border: 1px dashed #d1d5db;
      border-radius: 14px;
      padding: 48px 20px;
      text-align: center;
      color: #6b7280;
    }

    @media (max-width: 640px) {
      .app {
        margin: 28px auto;
      }

      .search-row {
        flex-direction: column;
      }

      .button {
        width: 100%;
      }

      .result-toolbar {
        align-items: stretch;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="header">
      <h1>업무 FAQ 검색</h1>
      <p>등록된 FAQ에서 질문이나 키워드를 검색할 수 있습니다.</p>
    </section>

    <section class="search-panel" aria-label="FAQ 검색">
      <div class="search-row">
        <input
          id="searchInput"
          type="search"
          placeholder="질문이나 키워드를 입력하세요."
          autocomplete="off"
          aria-label="질문이나 키워드 검색"
        />
        <button id="searchButton" class="button button-primary" type="button">검색</button>
      </div>

      <div class="filters" aria-label="분류 필터">
        <button class="filter-btn active" data-category="전체" type="button">전체</button>
        <button class="filter-btn" data-category="교육" type="button">교육</button>
        <button class="filter-btn" data-category="문서" type="button">문서</button>
        <button class="filter-btn" data-category="IT" type="button">IT</button>
        <button class="filter-btn" data-category="보안" type="button">보안</button>
        <button class="filter-btn" data-category="개인" type="button">개인</button>
      </div>
    </section>

    <section>
      <div class="result-toolbar">
        <div id="resultCount" class="result-count">검색 결과 0건</div>
        <button id="showAllButton" class="button button-secondary" type="button">전체보기</button>
      </div>

      <div id="results" class="results" aria-live="polite"></div>
    </section>
  </main>

  <script>
    // 첨부 JSON의 데이터만 사용합니다.
    const faqData = [
  {
    "category": "교육",
    "question": "교육 신청은 어디에서 하나요?",
    "answer_seed": "교육 포털의 과정 검색 후 신청 메뉴를 사용합니다."
  },
  {
    "category": "교육",
    "question": "신청한 교육을 취소하려면 어떻게 하나요?",
    "answer_seed": "신청내역에서 취소 가능 여부를 확인합니다."
  },
  {
    "category": "문서",
    "question": "주간 업무보고에는 무엇을 넣어야 하나요?",
    "answer_seed": "주요 실적, 이슈, 다음 주 계획을 중심으로 작성합니다."
  },
  {
    "category": "IT",
    "question": "사내 시스템 접속이 되지 않습니다.",
    "answer_seed": "네트워크, 브라우저, 계정 상태를 순서대로 확인합니다."
  },
  {
    "category": "보안",
    "question": "ChatGPT에 내부 업무자료를 넣어도 되나요?",
    "answer_seed": "교육에서는 합성자료를 사용하고, 실제 자료는 조직의 보안 및 AI 사용 기준을 먼저 확인합니다."
  },
  {
    "category": "개인",
    "question": "식권포인트로 담배사도 되나요?",
    "answer_seed": "식품과 음료만 구입 가능합니다. 단, 담배를 씹어서 섭취하신다면 식품으로 인정합니다."
  }
];

    let selectedCategory = "전체";
    let searchTerm = "";

    const searchInput = document.getElementById("searchInput");
    const searchButton = document.getElementById("searchButton");
    const showAllButton = document.getElementById("showAllButton");
    const resultCount = document.getElementById("resultCount");
    const results = document.getElementById("results");
    const filterButtons = [...document.querySelectorAll(".filter-btn")];

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeRegExp(value) {
      return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function highlight(text, keyword) {
      const safeText = escapeHtml(text);
      const trimmed = keyword.trim();

      if (!trimmed) return safeText;

      const words = trimmed
        .split(/\s+/)
        .filter(Boolean)
        .map(escapeRegExp);

      if (!words.length) return safeText;

      const regex = new RegExp(`(${words.join("|")})`, "gi");
      return safeText.replace(regex, "<mark>$1</mark>");
    }

    function getFilteredData() {
      const normalizedTerm = searchTerm.trim().toLowerCase();

      return faqData.filter((item) => {
        const categoryMatches =
          selectedCategory === "전체" || item.category === selectedCategory;

        const searchableText =
          `${item.question} ${item.answer_seed} ${item.category}`.toLowerCase();

        const keywordMatches =
          !normalizedTerm ||
          normalizedTerm
            .split(/\s+/)
            .filter(Boolean)
            .every((word) => searchableText.includes(word));

        return categoryMatches && keywordMatches;
      });
    }

    function render() {
      const filtered = getFilteredData();
      resultCount.textContent = `검색 결과 ${filtered.length}건`;

      if (filtered.length === 0) {
        results.innerHTML = `
          <div class="empty">
            조건에 맞는 FAQ가 없습니다.
          </div>
        `;
        return;
      }

      results.innerHTML = filtered
        .map(
          (item) => `
            <article class="faq-card">
              <span class="category">${highlight(item.category, searchTerm)}</span>
              <h2 class="question">${highlight(item.question, searchTerm)}</h2>
              <p class="answer">${highlight(item.answer_seed, searchTerm)}</p>
            </article>
          `
        )
        .join("");
    }

    function executeSearch() {
      searchTerm = searchInput.value;
      render();
    }

    function setCategory(category) {
      selectedCategory = category;

      filterButtons.forEach((button) => {
        button.classList.toggle(
          "active",
          button.dataset.category === selectedCategory
        );
      });

      render();
    }

    searchButton.addEventListener("click", executeSearch);

    searchInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        executeSearch();
      }
    });

    searchInput.addEventListener("input", () => {
      searchTerm = searchInput.value;
      render();
    });

    filterButtons.forEach((button) => {
      button.addEventListener("click", () => {
        setCategory(button.dataset.category);
      });
    });

    showAllButton.addEventListener("click", () => {
      searchInput.value = "";
      searchTerm = "";
      setCategory("전체");
      searchInput.focus();
    });

    render();
  </script>
</body>
</html>
